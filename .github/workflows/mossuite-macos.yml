name: Build and publish MosSuite macOS desktop app

on:
  push:
    branches: [main]
    paths:
      - 'mossuite-launcher/**'
      - '.github/workflows/mossuite-macos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS universal app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: mossuite-launcher
        run: npm install
      - name: Build universal macOS DMG and ZIP
        working-directory: mossuite-launcher
        run: npx electron-builder --mac dmg zip --universal --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mossuite-macos-universal
          path: mossuite-launcher/dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish macOS installers to GitHub Release
    concurrency:
      group: mossuite-v1.0.0-release
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mossuite-macos-universal
          path: release-assets
      - name: Publish macOS installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: main
          name: MosSuite Desktop v1.0.0
          generate_release_notes: true
          files: release-assets/*
