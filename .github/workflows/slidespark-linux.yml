name: Build SlideSpark for Linux

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux packages (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
          sudo snap install multipass
          sudo snap install snapcraft --classic --channel=7.x/stable
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: slidespark-linux
        run: npm install
      - name: Build Linux packages
        working-directory: slidespark-linux
        run: |
          mkdir -p build
          cp ../SlideSpark.png build/icon.png
          npx electron-builder --linux AppImage deb rpm tar.gz pacman snap --${{ matrix.arch }} --publish never
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: slidespark-linux-${{ matrix.arch }}
          path: |
            slidespark-linux/dist/*.AppImage
            slidespark-linux/dist/*.deb
            slidespark-linux/dist/*.rpm
            slidespark-linux/dist/*.tar.gz
            slidespark-linux/dist/*.pacman
            slidespark-linux/dist/*.snap
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Publish SlideSpark v1.0.4 release'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'branch' && 'v1.0.4' || github.ref_name }}
          name: SlideSpark ${{ github.ref_type == 'branch' && 'v1.0.4' || github.ref_name }} for Linux
          generate_release_notes: true
          files: |
            slidespark-linux/dist/*.AppImage
            slidespark-linux/dist/*.deb
            slidespark-linux/dist/*.rpm
            slidespark-linux/dist/*.tar.gz
            slidespark-linux/dist/*.pacman
            slidespark-linux/dist/*.snap
