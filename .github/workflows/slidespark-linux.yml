name: Build SlideSpark for Linux

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux packages (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools imagemagick
          sudo snap install multipass
          sudo snap install snapcraft --classic --channel=7.x/stable
          # Wait until Multipass is ready. Snapcraft will run with sudo in the build step
          # so it can access the Multipass daemon socket without relying on runner groups.
          for attempt in $(seq 1 30); do
            if sudo multipass version >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          sudo multipass version
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: slidespark-linux
        run: npm install
      - name: Build Linux packages
        working-directory: slidespark-linux
        run: |
          mkdir -p build
          convert ../SlideSpark.png -filter Lanczos -resize 512x512 build/icon.png
          # Keep electron-builder pinned at 26.0.12; 26.15.x has a broken snap template
          # that omits desktop-init.sh and makes the resulting Snap fail at launch.
          # Snapcraft 7 cannot cross-build ARM64 snaps on the AMD64 GitHub runner,
          # so publish the other ARM64 formats and build the Snap only for x64.
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo env "PATH=$PATH" ./node_modules/.bin/electron-builder --linux AppImage deb rpm tar.gz pacman --arm64 --publish never
          else
            sudo env "PATH=$PATH" ./node_modules/.bin/electron-builder --linux AppImage deb rpm tar.gz pacman snap --x64 --publish never
          fi
      - name: Publish Snap to Snap Store
        if: matrix.arch == 'x64'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "SNAPCRAFT_STORE_CREDENTIALS is not configured; skipping Snap Store upload."
            exit 0
          fi
          SNAP_FILE=$(find slidespark-linux/dist -maxdepth 1 -name '*.snap' -print -quit)
          if [ -z "$SNAP_FILE" ]; then
            echo "No Snap package was produced."
            exit 1
          fi
          sudo env SNAPCRAFT_STORE_CREDENTIALS="$SNAPCRAFT_STORE_CREDENTIALS" snapcraft upload "$SNAP_FILE" --release=stable
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: slidespark-linux-${{ matrix.arch }}
          path: |
            slidespark-linux/dist/*.AppImage
            slidespark-linux/dist/*.deb
            slidespark-linux/dist/*.rpm
            slidespark-linux/dist/*.tar.gz
            slidespark-linux/dist/*.pacman
            slidespark-linux/dist/*.snap
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Publish SlideSpark v1.0.5 release'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'branch' && 'v1.0.5' || github.ref_name }}
          name: SlideSpark ${{ github.ref_type == 'branch' && 'v1.0.5' || github.ref_name }} for Linux
          generate_release_notes: true
          files: |
            slidespark-linux/dist/*.AppImage
            slidespark-linux/dist/*.deb
            slidespark-linux/dist/*.rpm
            slidespark-linux/dist/*.tar.gz
            slidespark-linux/dist/*.pacman
            slidespark-linux/dist/*.snap

# Publish SlideSpark v1.0.5 release after rebuilding both Linux architectures.
