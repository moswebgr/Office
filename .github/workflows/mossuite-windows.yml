name: Build and publish MosSuite Windows installer

on:
  push:
    branches: [main]
    paths:
      - 'mossuite-windows/**'
      - 'mossuite-launcher/assets/icon.png'
      - '.github/workflows/mossuite-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  MOSSUITE_VERSION: 1.0.0

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Download WebView2 SDK
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2903.40' -OutFile webview2.zip
          Expand-Archive webview2.zip -DestinationPath webview2
      - name: Compile native C++ launcher
        shell: pwsh
        run: |
          $version = $env:MOSSUITE_VERSION
          $folder = "dist/MosSuite-Windows-$version"
          New-Item -ItemType Directory -Force "$folder/app", "$folder/assets" | Out-Null
          $sdk = Resolve-Path 'webview2/build/native'
          $env:INCLUDE = "$sdk/include;$env:INCLUDE"
          $lib = "$sdk/x64"
          cl /nologo /std:c++17 /EHsc /O2 /DUNICODE /D_UNICODE mossuite-windows/src/main.cpp /link /SUBSYSTEM:WINDOWS /LIBPATH:$lib WebView2LoaderStatic.lib urlmon.lib shell32.lib ole32.lib user32.lib advapi32.lib /OUT:"$folder/MosSuite.exe"
          Copy-Item mossuite-windows/app/index.html "$folder/app/index.html"
          Copy-Item mossuite-launcher/assets/mossuite-logo.svg "$folder/assets/"
          Copy-Item mossuite-launcher/assets/icon.png "$folder/assets/"
          Add-Type -AssemblyName System.Drawing
          $bitmap = [System.Drawing.Bitmap]::FromFile((Resolve-Path mossuite-launcher/assets/icon.png))
          $iconHandle = $bitmap.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle([IntPtr]$iconHandle)
          $stream = [System.IO.File]::Create((Join-Path (Resolve-Path $folder) "assets/mossuite.ico"))
          $icon.Save($stream)
          $stream.Dispose()
          $icon.Dispose()
          $bitmap.Dispose()
          Compress-Archive -Path "$folder/*" -DestinationPath "dist/MosSuite-Windows-$version.zip"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows Setup installer
        shell: pwsh
        run: |
          $version = $env:MOSSUITE_VERSION
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSourceDir=$((Resolve-Path "dist/MosSuite-Windows-$version").Path)" mossuite-windows/MosSuite.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (!(Test-Path "mossuite-windows/dist/MosSuite-Setup-$version.exe")) {
            # Inno Setup output is relative to the script; also accept repository-root dist.
            if (!(Test-Path "dist/MosSuite-Setup-$version.exe")) { throw "Setup executable was not created" }
          }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item "dist/MosSuite-Windows-$version.zip" release-assets/
          if (Test-Path "mossuite-windows/dist/MosSuite-Setup-$version.exe") {
            Copy-Item "mossuite-windows/dist/MosSuite-Setup-$version.exe" release-assets/
          } else {
            Copy-Item "dist/MosSuite-Setup-$version.exe" release-assets/
          }
      - uses: actions/upload-artifact@v4
        with:
          name: mossuite-windows-x64-installers
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mossuite-windows-x64-installers
          path: release-assets
      - name: Publish Windows installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload "v$env:MOSSUITE_VERSION" release-assets/* --clobber
