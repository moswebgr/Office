name: Build and publish MosSuite Linux desktop app

on:
  push:
    branches:
      - main
    paths:
      - 'mossuite-launcher/**'
      - '.github/workflows/mossuite-launcher-linux.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux packages (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: mossuite-launcher
        run: npm install
      - name: Build Linux packages
        working-directory: mossuite-launcher
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            npx electron-builder --linux AppImage deb rpm tar.gz --arm64 --publish never
          else
            npx electron-builder --linux AppImage deb rpm tar.gz --x64 --publish never
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mossuite-linux-${{ matrix.arch }}
          path: mossuite-launcher/dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish installers to GitHub Release
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mossuite-linux-*
          path: release-assets
          merge-multiple: true
      - name: Verify installer files
        run: |
          find release-assets -maxdepth 1 -type f -printf '%f\\n'
          test -n "$(find release-assets -maxdepth 1 -type f)"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-v1.0.1
          target_commitish: main
          name: MosSuite Linux Desktop v1.0.1
          generate_release_notes: true
          files: release-assets/*
