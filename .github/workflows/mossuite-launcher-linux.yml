name: Build and publish MosSuite Linux desktop app

on:
  push:
    branches: [main]
    paths:
      - 'mossuite-launcher/**'
      - '.github/workflows/mossuite-launcher-linux.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux packages (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: mossuite-launcher
        run: npm install
      - name: Build AppImage, Debian and tarball packages
        working-directory: mossuite-launcher
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            npx electron-builder --linux AppImage deb tar.gz --arm64 --publish never
          else
            npx electron-builder --linux AppImage deb tar.gz --x64 --publish never
          fi
      - name: Build RPM package (gzip payload)
        id: rpm
        continue-on-error: true
        working-directory: mossuite-launcher
        env:
          DEBUG: electron-builder
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            npx electron-builder --linux rpm --arm64 --publish never
          else
            npx electron-builder --linux rpm --x64 --publish never
          fi
      - name: Report RPM fallback
        if: steps.rpm.outcome == 'failure'
        run: echo "::warning::RPM packaging failed for ${{ matrix.arch }}. AppImage, DEB and tar.gz will still be published; inspect the RPM step debug output."
      - name: Verify Debian package for this architecture
        working-directory: mossuite-launcher
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            dpkg-deb --info dist/MosSuite-Linux-1.0.5-arm64.deb
          else
            dpkg-deb --info dist/MosSuite-Linux-1.0.5-amd64.deb
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mossuite-linux-${{ matrix.arch }}
          path: mossuite-launcher/dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish installers to GitHub Release
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mossuite-linux-*
          path: release-assets
          merge-multiple: true
      - name: Verify required installer files
        run: |
          test -s release-assets/MosSuite-Linux-1.0.5-amd64.deb
          test -s release-assets/MosSuite-Linux-1.0.5-arm64.deb
          test -s release-assets/MosSuite-Linux-1.0.5-x86_64.AppImage
          test -s release-assets/MosSuite-Linux-1.0.5-arm64.AppImage
          test -s release-assets/MosSuite-Linux-1.0.5-x64.tar.gz
          test -s release-assets/MosSuite-Linux-1.0.5-arm64.tar.gz
      - name: Remove previous Linux release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete launcher-v1.0.4 --yes --cleanup-tag || true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-v1.0.5
          target_commitish: main
          name: MosSuite Linux Desktop v1.0.5
          generate_release_notes: true
          files: release-assets/*
