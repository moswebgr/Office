ight:650;padding:18% 8% 2%;line-height:1.1;overflow:hidden}.thumb-preview .thumb-text{font-size:6px;padding:2px 8%;white-space:pre-wrap;overflow:hidden}.stage{display:flex;flex-direction:column;min-width:0;overflow:auto}.stage-head{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#555;font-size:12px;flex-shrink:0}.stage-area{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:8px 24px 20px;overflow:auto}.slide{width:min(100%,960px);aspect-ratio:16/9;background:#fff;box-shadow:0 2px 8px #0002;position:relative;overflow:hidden;color:#242424;flex-shrink:0}.slide-title{position:absolute;left:8%;top:13%;width:84%;min-height:10%;font-size:clamp(20px,3vw,40px);font-weight:650;line-height:1.15;outline:none;white-space:pre-wrap;overflow-wrap:anywhere}.slide-body{position:absolute;left:8%;top:34%;width:84%;height:54%;font-size:clamp(12px,1.5vw,22px);line-height:1.45;outline:none;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto}.slide-title:focus,.slide-body:focus{outline:1px dashed #0f6cbd;outline-offset:4px}.notes{height:74px;flex-shrink:0;background:#fff;border-top:1px solid var(--line);padding:8px 16px;color:#666}.notes input{width:100%;border:0;outline:0;background:transparent;padding:5px 0;color:#444}.statusbar{height:28px;border-top:1px solid #d6d4d2;background:#faf9f8;display:flex;align-items:center;gap:16px;padding:0 12px;color:#555;font-size:11px}.spacer{flex:1}.statusbar button{border:0;background:transparent;color:#444}.dialog-back{position:fixed;inset:0;background:#0005;display:none;align-items:center;justify-content:center;z-index:10}.dialog-back.open{display:flex}.dialog{width:min(420px,92vw);background:white;border-radius:8px;padding:20px;box-shadow:0 12px 40px #0003}.dialog h2{font-size:18px;margin:0 0 14px}.dialog label{display:block;margin:12px 0 5px}.dialog input,.dialog select{width:100%;padding:8px;border:1px solid #aaa;border-radius:4px}.dialog-actions{display:flex;just /* SlideSpark text animation presets */
@keyframes ss-fade{from{opacity:0}to{opacity:1}}
@keyframes ss-float{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes ss-fly{from{opacity:0;transform:translateX(-55px)}to{opacity:1;transform:translateX(0)}}
@keyframes ss-zoom{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes ss-rise{from{opacity:0;transform:translateY(55px)}to{opacity:1;transform:translateY(0)}}
@keyframes ss-bounce{0%{opacity:0;transform:scale(.65)}65%{opacity:1;transform:scale(1.08)}82%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes ss-spin{from{opacity:0;transform:rotate(-12deg) scale(.7)}to{opacity:1;transform:rotate(0) scale(1)}}
@keyframes ss-blur{from{opacity:0;filter:blur(12px);transform:translateY(8px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes ss-wipe{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes ss-type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.text-anim{animation-duration:800ms;animation-timing-function:cubic-bezier(.2,.75,.25,1);animation-fill-mode:both}
.anim-fade{animation-name:ss-fade}.anim-float-in{animation-name:ss-float}.anim-fly-in{animation-name:ss-fly}
.anim-zoom-in{animation-name:ss-zoom}.anim-rise-up{animation-name:ss-rise}.anim-bounce-in{animation-name:ss-bounce}
.anim-spin-in{animation-name:ss-spin}.anim-blur-in{animation-name:ss-blur}.anim-wipe{animation-name:ss-wipe}
.anim-typewriter{animation-name:ss-type;animation-timing-function:steps(28,end)}

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const KEY='mos.slidespark.powerpoint.v1';
const fresh=()=>({title:'Welcome to SlideSpark',body:'Create beautiful presentations with SlideSpark.\n\nClick here to edit this text.',notes:'',bg:'#ffffff',theme:'Office',titleColor:'#242424',bodyColor:'#404040',font:'Aptos',fontSize:22});
let slides=[fresh()],index=0,zoom=100,history=[],future=[],activeTab='Home',insertPending=false;
try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&Array.isArray(old.slides)&&old.slides.length){slides=old.slides.map(x=>({...fresh(),...x}));index=Math.max(0,Math.min(old.index||0,slides.length-1));$('#deckName').value=old.name||'Presentation1'}}catch{}
function snapshot(){return JSON.stringify({slides,index,name:$('#deckName').value})}
function checkpoint(){history.push(snapshot());if(history.length>60)history.shift();future=[]}
function persist(){try{localStorage.setItem(KEY,snapshot())}catch{}}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function current(){return slides[index]}
function saveCurrent(){if(!slides[index])return;slides[index].title=$('#slideTitle').innerText;slides[index].body=$('#slideBody').innerText;slides[index].notes=$('#notesInput').value;persist()}
function applySlide(){const s=current();$('#slideTitle').innerText=s.title;$('#slideBody').innerText=s.body;$('#notesInput').value=s.notes||'';$('#slideCanvas').style.background=s.bg||'#fff';$('#slideTitle').style.color=s.titleColor||'#242424';$('#slideBody').style.color=s.bodyColor||'#404040';$('#slideTitle').style.fontFamily=$('#slideBody').style.fontFamily=s.font||'Aptos';$('#slideBody').style.fontSize=(s.fontSize||22)+'px';$('#slideLabel').textContent='Slide '+(index+1)+' of '+slides.length;$('#statusSlides').textContent=slides.length+' slide'+(slides.length===1?'':'s');$('#thumbs').innerHTML=slides.map((s,n)=>'<div class="slide-thumb '+(n===index?'active':'')+'" data-i="'+n+'"><span class="slide-num">'+(n+1)+'</span><div class="thumb-preview" style="background:'+esc(s.bg||'#fff')+';color:'+esc(s.titleColor||'#242424')+'"><div class="thumb-title">'+esc(s.title)+'</div><div class="thumb-text" style="color:'+esc(s.bodyColor||'#404040')+'">'+esc(s.body)+'</div></div></div>').join('');$$('.slide-thumb').forEach(el=>el.onclick=()=>{saveCurrent();index=+el.dataset.i;renderAll()});persist()}
function addSlide(){checkpoint();saveCurrent();slides.splice(index+1,0,{...fresh(),title:'Slide title',body:'Add your content here.'});index++;renderAll()}
function button(label,icon,action,tip){return '<button class="tool" data-action="'+action+'" title="'+esc(tip||label)+'"><span class="ico">'+icon+'</span><span>'+label+'</span></button>'}
function group(content){return '<div class="rgroup">'+content+'</div>'}
function mini(content){return '<div class="mini-tools">'+content+'</div>'}
function renderRibbon(tab){activeTab=tab;$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let out='';
if(tab==='Home'){out=group(button('New slide','▤','add')+button('Duplicate','▣','duplicate')+button('Delete','▧','delete'))+group(button('Text box','T','text')+button('Picture','▧','image')+button('Title slide','▤','titleLayout'))+group(mini('<select id="fontSelect" aria-label="Font"><option>Aptos</option><option>Arial</option><option>Calibri</option><option>Georgia</option><option>Verdana</option></select><select id="fontSize" aria-label="Font size"><option>18</option><option selected>22</option><option>26</option><option>30</option><option>36</option><option>44</option><option>54</option></select><button data-action="bold"><b>B</b></button><button data-action="italic"><i>I</i></button><button data-action="alignLeft">≡</button><input type="color" id="textColor" value="'+esc(current().bodyColor||'#404040')+'" title="Text color">'))+group(button('Move up','↑','up')+button('Move down','↓','down'))+group(button('Undo','↶','undo')+button('Redo','↷','redo'))}
if(tab==='Insert'){out=group(button('New slide','▤','add')+button('Text box','T','text')+button('Picture','▧','image'))+group(button('Duplicate slide','▣','duplicate')+button('Delete slide','▧','delete'))+group(button('Add notes','▤','notes'))+group(button('Export PowerPoint','⇩','pptx')+button('Print / PDF','▤','print'))}
if(tab==='Design'){out=group('<div style="font-size:11px;max-width:80px">Slide background</div>'+mini('<input type="color" id="bgColor" value="'+esc(current().bg||'#ffffff')+'" title="Background color"><select id="themeSelect"><option>Office</option><option>Midnight</option><option>Ocean</option><option>Forest</option><option>Sunset</option><option>Minimal</option></select>'))+group(button('Apply theme','◈','theme')+button('Reset layout','↺','reset'))}
if(tab==='Transitions'){out=group('<div style="font-size:11px;max-width:90px">Transition between slides</div>'+mini('<select id="transitionSelect"><option>None</option><option>Fade</option><option>Push</option><option>Wipe</option></select>'))+group(button('Apply to all','✓','transitionAll'))}
if(tab==='Animations'){out=group('<div style="font-size:11px;max-width:90px">Text animation</div>'+mini('<select id="animationSelect"><option>None</option><option>Fade</option><option>Float In</option><option>Fly In</option><option>Zoom In</option><option>Rise Up</option><option>Bounce In</option><option>Spin In</option><option>Blur In</option><option>Wipe</option><option>Typewriter</option></select><select id="animationTarget" aria-label="Animation target"><option value="both">Title + body</option><option value="title">Title only</option><option value="body">Body only</option></select><select id="animationDuration" aria-label="Animation duration"><option value="400">Fast</option><option value="800" selected>Normal</option><option value="1400">Slow</option></select>'))+group(button('Preview','▶','previewAnim'))}
if(tab==='Slide Show'){out=group(button('From beginning','▶','showStart')+button('From current slide','▷','showCurrent'))+group(button('Print / PDF','▤','print'))}
if(tab==='Review'){out=group(button('Spell check','✓','spell')+button('Add comment','▤','comment'))+group(button('Speaker notes','▤','notes'))}
if(tab==='View'){out=group(button('Normal view','▦','normal')+button('Fit slide','□','fit'))+group(button('Zoom out','−','zoomOut')+button('Zoom in','＋','zoomIn'))+group(button('Save in browser','▣','save'))}
$('#ribbon').innerHTML=out;$$('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));const fs=$('#fontSelect');if(fs){fs.value=current().font||'Aptos';fs.onchange=()=>{checkpoint();current().font=fs.value;applySlide()}}const sz=$('#fontSize');if(sz){sz.value=String(current().fontSize||22);sz.onchange=()=>{checkpoint();current().fontSize=+sz.value;applySlide()}}const tc=$('#textColor');if(tc)tc.oninput=()=>{current().bodyColor=tc.value;$('#slideBody').style.color=tc.value;persist()};const bg=$('#bgColor');if(bg)bg.oninput=()=>{current().bg=bg.value;$('#slideCanvas').style.background=bg.value;persist();renderThumbsOnly()};const th=$('#themeSelect');if(th){th.value=current().theme||'Office';th.onchange=()=>applyTheme(th.value)}const tr=$('#transitionSelect');if(tr){tr.value=current().transition||'None';tr.onchange=()=>{current().transition=tr.value;persist()}}const an=$('#animationSelect');if(an){an.value=current().animation||'None';an.onchange=()=>{checkpoint();current().animation=an.value;persist();playTextAnimation()}}
const at=$('#animationTarget');if(at){at.value=current().animationTarget||'both';at.onchange=()=>{current().animationTarget=at.value;persist();playTextAnimation()}}
const ad=$('#animationDuration');if(ad){ad.value=String(current().animationDuration||800);ad.onchange=()=>{current().animationDuration=+ad.value;persist();playTextAnimation()}}}
function renderThumbsOnly(){const old=index;const container=$('#thumbs');container.innerHTML=slides.map((s,n)=>'<div class="slide-thumb '+(n===old?'active':'')+'" data-i="'+n+'"><span class="slide-num">'+(n+1)+'</span><div class="thumb-preview" style="background:'+esc(s.bg||'#fff')+';color:'+esc(s.titleColor||'#242424')+'"><div class="thumb-title">'+esc(s.title)+'</div><div class="thumb-text" style="color:'+esc(s.bodyColor||'#404040')+'">'+esc(s.body)+'</div></div></div>').join('');$$('.slide-thumb').forEach(el=>el.onclick=()=>{saveCurrent();index=+el.dataset.i;renderAll()})}
function renderAll(){applySlide();renderRibbon(activeTab)}
function applyTheme(name){checkpoint();const palettes={Office:['#ffffff','#242424','#404040'],Midnight:['#151a2d','#ffffff','#d7dcef'],Ocean:['#eaf5ff','#123b5d','#245e83'],Forest:['#eef6ed','#24452c','#3c6544'],Sunset:['#fff2e8','#7d2f22','#9d503a'],Minimal:['#ffffff','#111111','#333333']};const p=palettes[name]||palettes.Office;current().theme=name;current().bg=p[0];current().titleColor=p[1];current().bodyColor=p[2];renderAll()}
function playTextAnimation(){
const s=current(),title=$('#slideTitle'),body=$('#slideBody');
const names=['fade','float-in','fly-in','zoom-in','rise-up','bounce-in','spin-in','blur-in','wipe','typewriter'];
[title,body].forEach(el=>{el.classList.remove('text-anim',...names.map(n=>'anim-'+n));el.style.animationDuration=''});
const name=String(s.animation||'None').toLowerCase().replace(/\s+/g,'-');
if(name==='none'||!names.includes(name))return;
const target=s.animationTarget||'both',duration=Number(s.animationDuration)||800;
[title,body].forEach((el,i)=>{if(target==='both'||(target==='title'&&i===0)||(target==='body'&&i===1)){el.classList.add('text-anim','anim-'+name);el.style.animationDuration=duration+'ms'}});
}
function action(a){switch(a){case'add':addSlide();break;case'duplicate':checkpoint();saveCurrent();slides.splice(index+1,0,{...current()});index++;renderAll();break;case'delete':if(slides.length>1){checkpoint();slides.splice(index,1);index=Math.max(0,index-1);renderAll()}break;case'up':if(index>0){checkpoint();saveCurrent();[slides[index-1],slides[index]]=[slides[index],slides[index-1]];index--;renderAll()}break;case'down':if(index<slides.length-1){checkpoint();saveCurrent();[slides[index+1],slides[index]]=[slides[index],slides[index+1]];index++;renderAll()}break;case'text':$('#textDialog').classList.add('open');$('#newText').focus();break;case'image':$('#imageFile').click();break;case'titleLayout':checkpoint();current().title='Presentation title';current().body='Subtitle · Presenter · Date';renderAll();break;case'undo':undo();break;case'redo':redo();break;case'pptx':exportPptx();break;case'print':saveCurrent();window.print();break;case'theme':applyTheme($('#themeSelect')?.value||'Office');break;case'reset':checkpoint();current().title='Click to add title';current().body='Click to add text';renderAll();break;case'transitionAll':slides.forEach(s=>s.transition=current().transition||'None');persist();break;case'previewAnim':playTextAnimation();break;case'showStart':index=0;renderAll();present();break;case'showCurrent':present();break;case'normal':renderAll();break;case'fit':fit();break;case'zoomOut':setZoom(zoom-10);break;case'zoomIn':setZoom(zoom+10);break;case'save':saveCurrent();persist();alert('Presentation saved in this browser.');break;case'notes':$('#notesInput').focus();break;case'spell':alert('Browser spell checking is enabled in the slide text fields.');break;case'comment':alert('Select the slide text and add a note in the Notes field below the slide.');break;case'bold':document.execCommand('bold');break;case'italic':document.execCommand('italic');break;case'alignLeft':document.execCommand('justifyLeft');break;}}
function insertText(){const val=$('#newText').value.trim();if(!val)return;checkpoint();current().body+=(current().body?'\n\n':'')+val;$('#textDialog').classList.remove('open');$('#newText').value='';applySlide();saveCurrent()}
function setZoom(z){zoom=Math.max(50,Math.min(150,z));$('#zoomLabel').textContent=zoom+'%';$('#slideCanvas').style.width='min('+(zoom)+'%, 960px)';$('#slideCanvas').style.maxWidth='960px';$('#slideCanvas').style.width='min(calc(100% * '+(zoom/100)+'), 960px)'}
function fit(){zoom=100;$('#zoomLabel').textContent='Fit';$('#slideCanvas').style.width='min(100%, 960px)'}
function undo(){if(!history.length)return;future.push(snapshot());const v=JSON.parse(history.pop());slides=v.slides;index=v.index;$('#deckName').value=v.name;renderAll()}
function redo(){if(!future.length)return;history.push(snapshot());const v=JSON.parse(future.pop());slides=v.slides;index=v.index;$('#deckName').value=v.name;renderAll()}
function present(){saveCurrent();const w=window.open('','_blank');if(!w){alert('Allow pop-ups to start the slide show.');return}const deck=slides.map(s=>({title:s.title,body:s.body,bg:s.bg,titleColor:s.titleColor,bodyColor:s.bodyColor}));w.document.write('<!doctype html><meta charset="utf-8"><title>'+esc($('#deckName').value)+'</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:white;font:20px Segoe UI,Arial}.s{height:100vh;width:100vw;display:flex;flex-direction:column;justify-content:center;padding:8vw;page-break-after:always}.s h1{font-size:clamp(32px,5vw,70px);margin:0 0 30px}.s p{font-size:clamp(18px,2.2vw,34px);white-space:pre-wrap;line-height:1.5}#hint{position:fixed;bottom:12px;right:16px;color:#aaa;font-size:12px}</style><div id="root"></div><div id="hint">← → to navigate · Esc to exit</div><script>const d='+JSON.stringify(deck).replace(/</g,'\\u003c')+';let i='+index+';function draw(){const s=d[i];document.getElementById("root").innerHTML="<section class=\\"s\\" style=\\"background:"+s.bg+";color:"+s.titleColor+"\\"><h1>"+s.title.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</h1><p style=\\"color:"+s.bodyColor+"\\">"+s.body.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\\n/g,"<br>")+"</p></section>";document.getElementById("hint").textContent=(i+1)+" / "+d.length+" · ← → to navigate · Esc to exit"}onkeydown=e=>{if(e.key==="ArrowRight"||e.key===" "){i=Math.min(d.length-1,i+1);draw()}if(e.key==="ArrowLeft"){i=Math.max(0,i-1);draw()}if(e.key==="Escape")window.close()};draw();<\/script>');w.document.close()}
function exportPptx(){saveCurrent();if(!window.PptxGenJS){alert('PowerPoint export library could not load. Check your internet connection and try again.');return}try{const pptx=new PptxGenJS();pptx.layout='LAYOUT_WIDE';pptx.author='MosSuite';pptx.subject='Presentation created in SlideSpark';pptx.title=$('#deckName').value||'Presentation';pptx.company='MosSuite';slides.forEach(s=>{const sl=pptx.addSlide();sl.background={color:(s.bg||'#ffffff').replace('#','')};sl.addText(s.title||'',{x:0.7,y:0.7,w:12,h:1.25,fontFace:s.font||'Aptos',fontSize:34,bold:true,color:(s.titleColor||'#242424').replace('#',''),breakLine:false,fit:'shrink'});sl.addText(s.body||'',{x:0.8,y:2.25,w:11.5,h:4.6,fontFace:s.font||'Aptos',fontSize:s.fontSize||22,color:(s.bodyColor||'#404040').replace('#',''),breakLine:false,fit:'shrink',valign:'top',margin:0.05});if(s.notes)sl.addNotes(s.notes)});pptx.writeFile({fileName:($('#deckName').value||'Presentation').replace(/[^a-z0-9_-]/gi,'_')+'.pptx'}).catch(e=>alert('Export failed: '+e.message))}catch(e){alert('Could not export PowerPoint: '+e.message)}}
$('#slideTitle').addEventListener('input',()=>{current().title=$('#slideTitle').innerText;renderThumbsOnly();persist()});$('#slideBody').addEventListener('input',()=>{current().body=$('#slideBody').innerText;renderThumbsOnly();persist()});$('#notesInput').addEventListener('input',()=>{current().notes=$('#notesInput').value;persist()});$('#deckName').addEventListener('input',persist);$('#quickSave').onclick=()=>{saveCurrent();persist();};$('#commandSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.toLowerCase();if(q.includes('new')||q.includes('slide'))action('add');else if(q.includes('picture')||q.includes('image'))action('image');else if(q.includes('export')||q.includes('powerpoint'))action('pptx');else if(q.includes('show')||q.includes('present'))present();else if(q.includes('undo'))undo();else if(q.includes('redo'))redo();else if(q.includes('design')||q.includes('theme'))renderRibbon('Design');else if(q.includes('insert'))renderRibbon('Insert');else if(q.includes('home'))renderRibbon('Home');e.target.blur();}});
document.body.classList.add('dark-mode');$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)renderRibbon(b.dataset.tab)});$('#addSlideTop').onclick=addSlide;$('#startShow').onclick=()=>{saveCurrent();present()};$('#exportPptx').onclick=exportPptx;$('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;$('#zoomIn').onclick=()=>setZoom(zoom+10);$('#zoomOut').onclick=()=>setZoom(zoom-10);$('#fitSlide').onclick=fit;$('#confirmText').onclick=insertText;$('#cancelText').onclick=()=>$('#textDialog').classList.remove('open');$('#textDialog').onclick=e=>{if(e.target===$('#textDialog'))$('#textDialog').classList.remove('open')};$('#newText').addEventListener('keydown',e=>{if(e.key==='Enter')insertText()});
$('#imageFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{checkpoint();current().image=rd.result;let img=document.createElement('img');img.src=rd.result;img.alt='Slide image';img.style.cssText='position:absolute;right:8%;bottom:10%;max-width:35%;max-height:35%;object-fit:contain';$('#slideCanvas').querySelectorAll('.inserted-image').forEach(x=>x.remove());img.classList.add('inserted-image');$('#slideCanvas').append(img);if(!current().body.includes('[Image inserted]'))current().body+='\n\n[Image inserted]';saveCurrent()};rd.readAsDataURL(file);e.target.value=''};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}else if(e.key==='Delete'&&document.activeElement!==$('#slideTitle')&&document.activeElement!==$('#slideBody')&&slides.length>1){action('delete')}else if(e.key==='F5'){e.preventDefault();present()}});
const originalApply=applySlide;function applySlideWithImage(){originalApply();const old=$('#slideCanvas').querySelector('.inserted-image');if(old)old.remove();if(current().image){const img=document.createElement('img');img.src=current().image;img.className='inserted-image';img.alt='Slide image';img.style.cssText='position:absolute;right:8%;bottom:10%;max-width:35%;max-height:35%;object-fit:contain';$('#slideCanvas').append(img)}}
const baseRender=renderAll;renderAll=function(){applySlideWithImage();renderRibbon(activeTab);renderThumbsOnly();persist()};renderAll();
})();
