<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#212121">
<title>MosSuite — Microsoft sign-in</title>
<style>
html,body{margin:0;min-height:100%;background:#212121;color:#f5f5f5;font:16px/1.5 "Segoe UI",system-ui,sans-serif}
main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
section{max-width:460px;padding:28px;border:1px solid #444;border-radius:14px;background:#292929}
h1{font-size:1.25rem;margin:0 0 12px}p{color:#ddd;overflow-wrap:anywhere}a{color:#9cc5ff}
</style>
</head>
<body>
<main><section><h1 id="title">Completing Microsoft sign-in…</h1><p id="message">Please wait. Do not close this page.</p></section></main>
<script>
(function(){
  'use strict';
  const clientId='bb80cbb4-e711-42b9-96df-9b3eb0d85e94';
  const redirectUri=location.href.split(/[?#]/)[0];
  const title=document.getElementById('title');
  const message=document.getElementById('message');
  function fail(error){
    title.textContent='Microsoft sign-in could not be completed';
    message.textContent=(error&& (error.errorMessage||error.message))||'Check the Microsoft Entra app registration and try again.';
    const link=document.createElement('a');link.href='./';link.textContent='Return to MosSuite';message.appendChild(document.createElement('br'));message.appendChild(link);
    console.error('MosSuite Microsoft callback error:',error);
  }
  function loadMsal(urls,index){
    if(window.msal&&window.msal.PublicClientApplication){finish();return;}
    if(index>=urls.length){fail(new Error('The Microsoft authentication library could not load. Check your connection or content blockers.'));return;}
    const script=document.createElement('script');script.src=urls[index];script.onload=finish;script.onerror=()=>loadMsal(urls,index+1);document.head.appendChild(script);
  }
  async function finish(){
    if(finish.started)return;finish.started=true;
    try{
      const client=new window.msal.PublicClientApplication({
        auth:{clientId,authority:'https://login.microsoftonline.com/consumers',redirectUri},
        cache:{cacheLocation:'localStorage',storeAuthStateInCookie:false}
      });
      await client.initialize();
      const result=await client.handleRedirectPromise();
      if(result&&result.account)client.setActiveAccount(result.account);
      let target=sessionStorage.getItem('mos-ms-return-url');
      sessionStorage.removeItem('mos-ms-return-url');
      try{
        const parsed=new URL(target||'./',location.origin);
        if(parsed.origin!==location.origin||!parsed.pathname.startsWith(new URL('./',location.href).pathname.replace(/auth-callback\.html$/,'')))target='./';
      }catch(_){target='./';}
      title.textContent=result&&result.account?'Signed in successfully':'Returning to MosSuite…';
      message.textContent=result&&result.account?'Your Microsoft account is connected. Redirecting you back…':'Redirecting you back to the app…';
      location.replace(target||'./');
    }catch(error){fail(error);}
  }
  loadMsal([
    'https://alcdn.msauth.net/browser/2.39.0/js/msal-browser.min.js',
    'https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.39.0/lib/msal-browser.min.js'
  ],0);
})();
</script>
</body>
</html>
