<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111214"><title>MosSuite Launcher</title><link rel="icon" href="../assets/mossuite-logo.svg">
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",Arial,sans-serif;background:#111214;color:#eee}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111214;color:#eee}body{font-size:13px;padding-bottom:32px}.topbar{height:46px;display:flex;align-items:center;border-bottom:1px solid #38393b;background:#141517;position:sticky;top:0;z-index:5}.brand{height:100%;display:flex;align-items:center;padding:0 20px;border-right:1px solid #38393b;font-size:19px;font-weight:900;letter-spacing:-.045em}.brand-mark{display:inline-block;width:27px;height:27px;object-fit:contain;margin-right:9px;flex:0 0 27px}.suite-label{padding-left:16px;color:#999;font:700 10px ui-monospace,monospace;letter-spacing:.2em}.top-spacer{flex:1}.top-action{width:48px;height:100%;border:0;border-left:1px solid #38393b;background:transparent;color:#aaa;font-size:17px;cursor:pointer}.top-action:hover,.tool-btn:hover,.refresh:hover{background:#252629;color:#fff}.page{padding:18px 20px 22px;max-width:1600px;margin:auto}.toolbar{display:flex;align-items:center;gap:8px;min-height:34px;margin-bottom:24px}.refresh{width:34px;height:34px;border:1px solid #383a3d;background:#151618;color:#aaa;font-size:19px;cursor:pointer}.toolbar-spacer{flex:1}.sort-label{font:700 10px ui-monospace,monospace;letter-spacing:.18em;color:#777}.sort,.search{height:34px;border:1px solid #383a3d;border-radius:0;background:#0d0e10;color:#eee;padding:0 10px;font:inherit}.sort{width:190px}.search{width:200px}.search::placeholder{color:#999}.view-switch{display:flex;border:1px solid #383a3d}.tool-btn{width:33px;height:32px;border:0;background:#151618;color:#aaa;font-size:17px;cursor:pointer}.tool-btn.active{background:#f3f3f3;color:#111}.section-title{margin:0 0 16px;color:#777;font:700 10px ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase}.installed-grid{display:grid;grid-template-columns:repeat(3,minmax(0,360px));gap:0;margin-bottom:32px}.catalog-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid #383a3d;border-left:1px solid #383a3d}.card{min-width:0;background:#111214;border:1px solid #383a3d;display:flex;flex-direction:column}.installed-card{height:222px;padding:0 19px 19px;border-top:1px solid #383a3d;border-left:1px solid #383a3d}.installed-head{height:34px;display:flex;align-items:center;gap:14px;color:#999}.app-icon{width:56px;height:56px;flex:0 0 56px;display:grid;place-items:center;border-radius:12px;background:#777;color:#171819;font-size:17px;font-weight:900;letter-spacing:-.06em}.installed-head .app-icon{width:56px;height:22px;flex-basis:56px;border-radius:0;font-size:12px}.app-category{color:#999;font-size:13px}.installed-description{color:#aaa;line-height:1.45;margin:7px 0 10px}.updated{color:#777;font-size:12px;margin:0 0 14px}.installed-actions{display:flex;gap:8px;margin-top:auto}.open-btn,.install-btn{height:35px;flex:1;border:1px solid #858585;background:transparent;color:#eee;font:900 10px ui-monospace,monospace;letter-spacing:.16em;cursor:pointer}.open-btn:hover{background:#eee;color:#111}.more{width:37px;height:35px;border:1px solid #383a3d;background:transparent;color:#aaa;font-size:16px;cursor:pointer}.more:hover{background:#292a2d;color:#fff}.catalog-card{min-height:314px;border-top:0;border-left:0}.card-top{height:39px;padding:0 19px;border-bottom:1px solid #383a3d;display:flex;align-items:center;justify-content:space-between;color:#858585;font:700 10px ui-monospace,monospace;letter-spacing:.16em}.github{color:#aaa;text-decoration:none}.github:hover{color:#fff}.catalog-main{padding:18px 19px 7px;display:flex;align-items:flex-start;gap:14px}.catalog-main .app-icon{width:56px;height:56px}.app-copy{min-width:0}.name-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.card h3{font-size:22px;line-height:1.1;margin:5px 0 4px;letter-spacing:-.04em}.byline{border:1px solid #45474a;padding:3px 6px;color:#8db9ff;font:800 9px ui-monospace,monospace;white-space:nowrap}.category{color:#aaa;font-size:12px}.availability{margin:19px 19px 10px;align-self:flex-start;border:1px solid #414347;padding:3px 6px;color:#8db9ff;font:800 9px ui-monospace,monospace;letter-spacing:.08em}.description{padding:0 19px;margin:10px 0 9px;color:#aaa;line-height:1.4;min-height:34px}.meta{padding:0 19px;color:#777;font-size:11px;margin:0 0 12px}.catalog-bottom{margin-top:auto;padding:0 16px 16px;display:flex;gap:8px}.install-btn{background:#f3f3f3;border-color:#eee;color:#111}.install-btn:hover{background:#d7d7d7}.status{padding:0 19px 10px;color:#777;font-size:10px}.status.ready{color:#8dcba6}.catalog-grid.list{display:block}.catalog-grid.list .catalog-card{min-height:0;display:grid;grid-template-columns:140px minmax(200px,1fr) minmax(180px,1.3fr) 190px;align-items:center}.catalog-grid.list .card-top{height:auto;border:0;padding:0 14px}.catalog-grid.list .catalog-main{padding:10px}.catalog-grid.list .catalog-main .app-icon{width:42px;height:42px;flex-basis:42px}.catalog-grid.list .card h3{font-size:17px}.catalog-grid.list .description{min-height:0;margin:0;padding:10px}.catalog-grid.list .availability,.catalog-grid.list .meta,.catalog-grid.list .status{display:none}.catalog-grid.list .catalog-bottom{padding:10px;margin:0}.empty{display:none;padding:24px;border:1px dashed #383a3d;color:#888;text-align:center}.footer{position:fixed;bottom:0;left:0;right:0;height:32px;background:#151618;border-top:1px solid #383a3d;display:flex;align-items:center;padding:0 20px;color:#777;font:700 10px ui-monospace,monospace;letter-spacing:.14em;z-index:4}.footer-right{margin-left:auto;display:flex;gap:14px;align-items:center;font:14px Arial,sans-serif;letter-spacing:0}.footer a{color:#777;text-decoration:none}.footer a:hover{color:#eee}.hidden{display:none!important}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #8db9ff;outline-offset:2px}@media(max-width:900px){.catalog-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.installed-grid{grid-template-columns:repeat(2,minmax(0,360px))}.catalog-grid.list .catalog-card{grid-template-columns:110px 1fr 1fr 150px}}@media(max-width:620px){.page{padding:12px}.toolbar{flex-wrap:wrap}.toolbar-spacer{display:none}.sort-label{margin-left:auto}.sort{width:140px}.search{width:100%;order:5}.catalog-grid{grid-template-columns:1fr}.installed-grid{grid-template-columns:1fr}.catalog-grid.list .catalog-card{display:flex}.catalog-grid.list .card-top{padding:10px 14px}.catalog-grid.list .catalog-main{padding:12px 14px}.catalog-grid.list .description{padding:0 14px 12px}.catalog-grid.list .catalog-bottom{padding:0 14px 14px}.suite-label{font-size:8px}.brand{padding:0 12px}.footer{padding:0 10px;font-size:8px}.footer-right{gap:8px}}
</style></head><body>
<header class="topbar"><div class="brand"><img class="brand-mark" src="../assets/mossuite-logo.svg" alt="MosSuite logo"> MosSuite</div><div class="suite-label">DESKTOP APP SUITE</div><div class="top-spacer"></div><button class="top-action" id="settings" title="Launcher settings" aria-label="Launcher settings">⚙</button></header>
<main class="page"><div class="toolbar"><button class="refresh" id="refresh" title="Refresh apps" aria-label="Refresh apps">↻</button><div class="toolbar-spacer"></div><label class="sort-label" for="sort">SORT</label><select class="sort" id="sort" aria-label="Sort apps"><option value="name">Name (A–Z)</option><option value="name-desc">Name (Z–A)</option><option value="category">Category</option><option value="installed">Installed first</option></select><input class="search" id="search" type="search" placeholder="Search apps" aria-label="Search apps"><div class="view-switch"><button class="tool-btn active" id="gridView" aria-label="Grid view" title="Grid view">▦</button><button class="tool-btn" id="listView" aria-label="List view" title="List view">☰</button></div></div>
<section id="installedSection"><div class="installed-grid" id="installedCards"></div></section><section><h2 class="section-title">NOT INSTALLED</h2><div class="catalog-grid" id="availableCards"></div><div class="empty" id="empty">No apps match your search.</div></section></main>
<footer class="footer"><span id="footerStatus">CHECKED JUST NOW · MOS SUITE APP CATALOG</span><div class="footer-right"><a href="https://github.com/moswebgr/Office" title="GitHub" target="_blank" rel="noopener">◉</a><a href="https://moswebgr.github.io/Office/" title="MosSuite website" target="_blank" rel="noopener">◎</a><span title="Desktop launcher">MOS</span></div></footer>
<script>
const github={gridforge:"https://github.com/moswebgr/Office/tree/main/gridforge",slidespark:"https://github.com/moswebgr/Office/tree/main/slidespark",datanest:"https://github.com/moswebgr/Office/tree/main/datanest",mailnest:"https://github.com/moswebgr/Office/tree/main/mailnest"};
const symbols={gridforge:"GF",slidespark:"SS",datanest:"DN",mailnest:"MN"};
let allApps=[];
async function listApps(){return window.mosSuite.listApps();}async function installApp(id){return window.mosSuite.installApp(id);}async function openApp(id){return window.mosSuite.openApp(id);}
function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function installedCard(a){return '<article class="card installed-card" data-id="'+safe(a.id)+'"><div class="installed-head"><div class="app-icon">'+(symbols[a.id]||"MS")+'</div><span class="app-category"><strong>'+safe(a.name)+'</strong> · '+safe(a.category)+'</span></div><p class="installed-description">'+safe(a.description)+'</p><p class="updated">Installed on this device</p><div class="installed-actions"><button class="open-btn" data-action="open" data-id="'+safe(a.id)+'">OPEN</button><button class="more" data-more="'+safe(a.id)+'" title="More options">…</button></div></article>';}
function catalogCard(a){return '<article class="card catalog-card" data-id="'+safe(a.id)+'"><div class="card-top"><span>MOS SUITE APP</span><a class="github" href="'+github[a.id]+'" target="_blank" rel="noopener">GITHUB ↗</a></div><div class="catalog-main"><div class="app-icon">'+(symbols[a.id]||"MS")+'</div><div class="app-copy"><div class="name-line"><h3>'+safe(a.name)+'</h3><span class="byline">BY MOSWEB</span></div><div class="category">'+safe(a.category)+'</div></div></div><div class="availability">AVAILABLE TO INSTALL</div><p class="description">'+safe(a.description)+'</p><p class="meta">Online app · Download size varies</p><div class="status" id="status-'+safe(a.id)+'">Available online</div><div class="catalog-bottom"><button class="install-btn" data-action="install" data-id="'+safe(a.id)+'">INSTALL</button><button class="more" data-more="'+safe(a.id)+'" title="More options">…</button></div></article>';}
function render(){const q=document.getElementById("search").value.trim().toLowerCase(),sort=document.getElementById("sort").value;let apps=allApps.filter(a=>(a.name+" "+a.category+" "+a.description).toLowerCase().includes(q));apps.sort((a,b)=>sort==="name-desc"?b.name.localeCompare(a.name):sort==="category"?a.category.localeCompare(b.category)||a.name.localeCompare(b.name):sort==="installed"?Number(b.installed)-Number(a.installed)||a.name.localeCompare(b.name):a.name.localeCompare(b.name));const installed=apps.filter(a=>a.installed),available=apps.filter(a=>!a.installed);document.getElementById("installedCards").innerHTML=installed.map(installedCard).join("");document.getElementById("availableCards").innerHTML=available.map(catalogCard).join("");document.getElementById("installedSection").classList.toggle("hidden",!installed.length);document.getElementById("empty").style.display=available.length?"none":"block";document.getElementById("empty").textContent=apps.length?"No apps available to install.":"No apps match your search.";document.getElementById("availableCards").classList.toggle("list",document.body.dataset.view==="list");}
async function refresh(){const b=document.getElementById("refresh");b.textContent="…";try{allApps=await listApps();render();document.getElementById("footerStatus").textContent="CHECKED JUST NOW · MOS SUITE APP CATALOG";}catch(e){document.getElementById("empty").textContent="Could not load apps: "+e.message;document.getElementById("empty").style.display="block";document.getElementById("footerStatus").textContent="CONNECTION ERROR · TRY REFRESHING";}finally{b.textContent="↻";}}
document.getElementById("search").addEventListener("input",render);document.getElementById("sort").addEventListener("change",render);document.getElementById("refresh").addEventListener("click",refresh);
function setView(v){document.body.dataset.view=v;document.getElementById("gridView").classList.toggle("active",v==="grid");document.getElementById("listView").classList.toggle("active",v==="list");render();}
document.getElementById("gridView").addEventListener("click",()=>setView("grid"));document.getElementById("listView").addEventListener("click",()=>setView("list"));document.getElementById("settings").addEventListener("click",()=>alert("MosSuite Launcher\nYour apps, in one desktop.\n\nInstall an app to keep an offline copy on this device."));
document.addEventListener("click",async e=>{const action=e.target.closest("[data-action]"),more=e.target.closest("[data-more]");if(more){const id=more.dataset.more;if(github[id])window.open(github[id],"_blank","noopener");return;}if(!action)return;const id=action.dataset.id,status=document.getElementById("status-"+id);action.disabled=true;try{if(action.dataset.action==="install"){action.textContent="INSTALLING…";if(status)status.textContent="Downloading app and shared assets…";await installApp(id);}else{action.textContent="OPENING…";await openApp(id);}await refresh();}catch(err){if(status)status.textContent="Error: "+String(err.message||err);action.disabled=false;action.textContent=action.dataset.action==="install"?"INSTALL":"OPEN";}});
refresh();
</script></body></html>
