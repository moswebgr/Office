<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MosSuite Launcher</title><link rel="icon" type="image/svg+xml" href="../assets/mossuite-logo.svg">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#263c5d 0,#111827 48%,#0b1020 100%);color:#eef4ff;font:15px system-ui,-apple-system,sans-serif;padding:42px 24px}main{max-width:980px;margin:auto}.brand{display:flex;align-items:center;gap:18px;margin-bottom:22px}.brand img{width:76px;height:76px;filter:drop-shadow(0 8px 20px #0008)}h1{font-size:34px;letter-spacing:-.8px;margin:0}.tagline{color:#aab9d0;margin:6px 0 0}.notice{color:#b7c7dd;margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:linear-gradient(145deg,#1b2940,#151e30);border:1px solid #34445f;border-radius:18px;padding:25px;box-shadow:0 14px 34px #0003}.card h2{margin:0 0 8px;font-size:21px}.card p{color:#aab9d0;min-height:24px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;cursor:pointer;background:linear-gradient(110deg,#168bd2,#376bd4);color:white;border-radius:10px;padding:11px 16px;text-decoration:none;font-weight:650}.btn.secondary{background:#34445f}.status{font-size:12px;color:#8fb6d9;margin-top:14px;min-height:18px}.foot{color:#8191aa;margin-top:28px;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}.brand img{width:60px;height:60px}h1{font-size:28px}}
</style></head><body><main><header class="brand"><img src="../assets/mossuite-logo.svg" alt="MosSuite logo"><div><h1>MosSuite</h1><p class="tagline">Your workspace. One desktop.</p></div></header><p class="notice">Download each app once to keep a local copy and open it later without internet.</p><div class="grid" id="apps"></div><p class="foot">Apps marked “Downloaded” are stored on this computer. Online updates require an internet connection.</p></main>
<script>
const descriptions={gridforge:"Calendars, schedules, and tables.",slidespark:"Create and edit presentations.",datanest:"Organize your information.",mailnest:"Email workspace with Microsoft sign-in."};
async function render(){const apps=await window.mosSuite.listApps();document.getElementById("apps").innerHTML=apps.map(a=>'<section class="card"><h2>'+a.name+'</h2><p>'+descriptions[a.id]+'</p><div class="actions"><button class="btn" data-install="'+a.id+'">'+(a.installed?"Update download":"Download for offline")+'</button><button class="btn secondary" data-open="'+a.id+'">Open app</button></div><div class="status" id="status-'+a.id+'">'+(a.installed?"Downloaded on this device":"Not downloaded")+'</div></section>').join("");}
document.addEventListener("click",async e=>{const install=e.target.closest("[data-install]"),open=e.target.closest("[data-open]");if(!install&&!open)return;const id=(install||open).dataset[install?"install":"open"],status=document.getElementById("status-"+id);try{if(install){install.disabled=true;status.textContent="Downloading…";await window.mosSuite.installApp(id);status.textContent="Downloaded. Available offline.";install.textContent="Update download";}else{status.textContent="Opening…";const result=await window.mosSuite.openApp(id);status.textContent=result.offline?"Opened local offline copy":"Opened online (download it for offline use).";}}catch(err){status.textContent="Error: "+err.message;}finally{if(install)install.disabled=false;}});
render().catch(e=>{document.getElementById("apps").textContent="Could not load app list: "+e.message;});
</script></body></html>
