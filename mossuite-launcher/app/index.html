<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111214"><title>MosSuite Launcher</title><link rel="icon" href="../assets/mossuite-logo.svg">
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",Arial,sans-serif;background:#111214;color:#eee}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111214;color:#eee;font-size:13px}.topbar{height:46px;display:flex;align-items:center;border-bottom:1px solid #353638;background:#141517;position:sticky;top:0;z-index:5}.brand{height:100%;display:flex;align-items:center;padding:0 20px;border-right:1px solid #353638;gap:10px;font-size:19px;font-weight:900;letter-spacing:-.04em}.brand img{width:24px;height:24px;object-fit:contain}.suite-label{padding-left:16px;color:#999;font:700 10px ui-monospace,monospace;letter-spacing:.2em}.top-spacer{flex:1}.top-action{width:48px;height:100%;border:0;border-left:1px solid #353638;background:transparent;color:#aaa;font-size:17px;cursor:pointer}.top-action:hover,.tool-btn:hover{background:#252629;color:#fff}.page{padding:18px 20px 44px;max-width:1600px;margin:auto}.toolbar{display:flex;align-items:center;gap:8px;min-height:38px;margin-bottom:24px}.refresh{width:34px;height:34px;border:1px solid #383a3d;background:#151618;color:#aaa;font-size:19px;cursor:pointer}.toolbar-spacer{flex:1}.sort-label{font:700 10px ui-monospace,monospace;letter-spacing:.18em;color:#777}.sort,.search{height:34px;border:1px solid #383a3d;background:#0d0e10;color:#eee;padding:0 10px;font:inherit}.sort{width:190px}.search{width:200px}.view-switch{display:flex;border:1px solid #383a3d}.tool-btn{width:34px;height:32px;border:0;background:#151618;color:#aaa;font-size:16px;cursor:pointer}.tool-btn.active{background:#f3f3f3;color:#111}.section-title{margin:0 0 14px;color:#777;font:700 10px ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase}.section{margin-bottom:34px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid #383a3d;border-left:1px solid #383a3d}.card{min-width:0;min-height:314px;border-right:1px solid #383a3d;border-bottom:1px solid #383a3d;display:flex;flex-direction:column;background:#111214}.card-top{height:39px;padding:0 19px;border-bottom:1px solid #383a3d;display:flex;align-items:center;justify-content:space-between;color:#858585;font:700 10px ui-monospace,monospace;letter-spacing:.16em}.github{color:#aaa;text-decoration:none}.github:hover{color:#fff}.card-main{padding:18px 19px 10px;display:flex;align-items:flex-start;gap:14px}.app-icon{width:56px;height:56px;flex:0 0 56px;object-fit:contain;background:#777;border-radius:12px;padding:4px}.app-copy{min-width:0}.name-line{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.card h3{font-size:22px;line-height:1.1;margin:5px 0 4px;letter-spacing:-.04em}.byline{border:1px solid #45474a;padding:3px 6px;color:#8db9ff;font:800 9px ui-monospace,monospace;white-space:nowrap}.category{color:#aaa;font-size:12px}.description{padding:0 19px;margin:10px 0 13px;color:#aaa;line-height:1.45;min-height:36px}.meta{padding:0 19px;color:#777;font-size:11px;margin-bottom:12px}.availability{margin:0 19px 10px;align-self:flex-start;border:1px solid #414347;padding:3px 6px;color:#8db9ff;font:800 9px ui-monospace,monospace;letter-spacing:.08em}.card-bottom{margin-top:auto;padding:0 16px 16px;display:flex;gap:8px}.primary{height:35px;flex:1;border:1px solid #eee;background:#f3f3f3;color:#111;font:900 10px ui-monospace,monospace;letter-spacing:.16em;cursor:pointer}.primary:hover{background:#d7d7d7}.more{width:37px;height:35px;border:1px solid #383a3d;background:transparent;color:#aaa;font-size:16px;cursor:pointer}.more:hover{background:#292a2d;color:white}.status{padding:0 19px 11px;color:#777;font-size:10px}.status.ready{color:#8dcba6}.cards.list{display:block}.cards.list .card{min-height:0;display:grid;grid-template-columns:140px minmax(200px,1fr) minmax(180px,1.3fr) 190px;align-items:center}.cards.list .card-top{height:auto;border:0;padding:0 14px}.cards.list .card-main{padding:10px}.cards.list .app-icon{width:42px;height:42px;flex-basis:42px}.cards.list .card h3{font-size:17px}.cards.list .description{min-height:0;margin:0;padding:10px}.cards.list .meta,.cards.list .availability{display:none}.cards.list .card-bottom{padding:10px;margin:0}.cards.list .status{display:none}.empty{display:none;padding:24px;border:1px dashed #383a3d;color:#888;text-align:center}.hidden{display:none!important}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #8db9ff;outline-offset:2px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.cards.list .card{grid-template-columns:110px 1fr 1fr 150px}}@media(max-width:620px){.page{padding:12px}.toolbar{flex-wrap:wrap}.toolbar-spacer{display:none}.sort-label{margin-left:auto}.sort{width:140px}.search{width:100%;order:5}.cards{grid-template-columns:1fr}.cards.list .card{display:flex}.cards.list .card-top{padding:10px 14px}.cards.list .card-main{padding:12px 14px}.cards.list .description{padding:0 14px 12px}.cards.list .card-bottom{padding:0 14px 14px}.suite-label{font-size:8px}.brand{padding:0 12px}}
</style></head>
<body>
<header class="topbar"><div class="brand"><img src="../assets/mossuite-logo.svg" alt="">MosSuite</div><div class="suite-label">DESKTOP APP SUITE</div><div class="top-spacer"></div><button class="top-action" id="settings" title="Launcher information" aria-label="Launcher information">⚙</button></header>
<main class="page">
<div class="toolbar"><button class="refresh" id="refresh" title="Refresh apps" aria-label="Refresh apps">↻</button><div class="toolbar-spacer"></div><label class="sort-label" for="sort">SORT</label><select class="sort" id="sort" aria-label="Sort apps"><option value="name">Name (A–Z)</option><option value="name-desc">Name (Z–A)</option><option value="category">Category</option><option value="installed">Installed first</option></select><input class="search" id="search" type="search" placeholder="Search apps" aria-label="Search apps"><div class="view-switch"><button class="tool-btn active" id="gridView" aria-label="Grid view" title="Grid view">▦</button><button class="tool-btn" id="listView" aria-label="List view" title="List view">☰</button></div></div>
<section class="section" id="installedSection"><h2 class="section-title">Installed</h2><div class="cards" id="installedCards"></div></section>
<section class="section"><h2 class="section-title">Not installed</h2><div class="cards" id="availableCards"></div><div class="empty" id="empty">No apps match your search.</div></section>
</main>
<script>
const assets={gridforge:"../../gridforge.png",slidespark:"../../SlideSpark.png",datanest:"../../datanest-removebg-preview.png",mailnest:"../../mailnest.jpg"};
const github={gridforge:"https://github.com/moswebgr/Office/tree/main/gridforge",slidespark:"https://github.com/moswebgr/Office/tree/main/slidespark",datanest:"https://github.com/moswebgr/Office/tree/main/datanest",mailnest:"https://github.com/moswebgr/Office/tree/main/mailnest"};
let allApps=[];
async function listApps(){return window.mosSuite.listApps();}
async function installApp(id){return window.mosSuite.installApp(id);}
async function openApp(id){return window.mosSuite.openApp(id);}
function card(a){const img=assets[a.id]||"../assets/mossuite-logo.svg";return '<article class="card" data-search="'+(a.name+" "+a.category+" "+a.description).toLowerCase().replace(/"/g,"&quot;")+'"><div class="card-top"><span>'+(a.installed?"INSTALLED":"MOS SUITE APP")+'</span><a class="github" href="'+github[a.id]+'" target="_blank" rel="noopener">GITHUB ↗</a></div><div class="card-main"><img class="app-icon" src="'+img+'" onerror="this.onerror=null;this.src=\'../assets/mossuite-logo.svg\'" alt=""><div class="app-copy"><div class="name-line"><h3>'+a.name+'</h3><span class="byline">BY MOSWEB</span></div><div class="category">'+a.category+'</div></div></div><p class="description">'+a.description+'</p><div class="availability">'+(a.installed?"READY TO OPEN":"AVAILABLE TO INSTALL")+'</div><div class="meta">'+(a.installed?"Offline copy installed":"Online app · Download size varies")+'</div><div class="status '+(a.installed?"ready":"")+'" id="status-'+a.id+'">'+(a.installed?"Ready on this device":"Not installed")+'</div><div class="card-bottom"><button class="primary" data-action="'+(a.installed?"open":"install")+'" data-id="'+a.id+'">'+(a.installed?"OPEN":"INSTALL")+'</button><button class="more" data-more="'+a.id+'" title="More options" aria-label="More options for '+a.name+'">…</button></div></article>';}
function render(){const q=document.getElementById("search").value.trim().toLowerCase(),sort=document.getElementById("sort").value;let apps=allApps.filter(a=>(a.name+" "+a.category+" "+a.description).toLowerCase().includes(q));apps.sort((a,b)=>sort==="name-desc"?b.name.localeCompare(a.name):sort==="category"?a.category.localeCompare(b.category)||a.name.localeCompare(b.name):sort==="installed"?Number(b.installed)-Number(a.installed)||a.name.localeCompare(b.name):a.name.localeCompare(b.name));const installed=apps.filter(a=>a.installed),available=apps.filter(a=>!a.installed);document.getElementById("installedCards").innerHTML=installed.map(card).join("");document.getElementById("availableCards").innerHTML=available.map(card).join("");document.getElementById("installedSection").classList.toggle("hidden",!installed.length);document.getElementById("empty").style.display=apps.length?"none":"block";document.querySelectorAll(".cards").forEach(el=>el.classList.toggle("list",document.body.dataset.view==="list"));}
async function refresh(){document.getElementById("refresh").textContent="…";try{allApps=await listApps();render();}catch(e){document.getElementById("empty").textContent="Could not load apps: "+e.message;document.getElementById("empty").style.display="block";}finally{document.getElementById("refresh").textContent="↻";}}
document.getElementById("search").addEventListener("input",render);document.getElementById("sort").addEventListener("change",render);document.getElementById("refresh").addEventListener("click",refresh);
function setView(v){document.body.dataset.view=v;document.getElementById("gridView").classList.toggle("active",v==="grid");document.getElementById("listView").classList.toggle("active",v==="list");render();}
document.getElementById("gridView").addEventListener("click",()=>setView("grid"));document.getElementById("listView").addEventListener("click",()=>setView("list"));
document.getElementById("settings").addEventListener("click",()=>alert("MosSuite Launcher\nYour apps, in one desktop.\n\nInstall an app to keep an offline copy on this device."));
document.addEventListener("click",async e=>{const action=e.target.closest("[data-action]"),more=e.target.closest("[data-more]");if(more){const a=allApps.find(x=>x.id===more.dataset.more);if(a)window.open(github[a.id],"_blank","noopener");return;}if(!action)return;const id=action.dataset.id,app=allApps.find(x=>x.id===id),status=document.getElementById("status-"+id);action.disabled=true;try{if(action.dataset.action==="install"){action.textContent="INSTALLING…";status.textContent="Downloading app and shared assets…";await installApp(id);}else{action.textContent="OPENING…";status.textContent="Opening app…";await openApp(id);}await refresh();}catch(err){status.textContent="Error: "+String(err.message||err);action.disabled=false;action.textContent=action.dataset.action==="install"?"INSTALL":"OPEN";}});
refresh();
</script></body></html>
