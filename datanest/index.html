<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create structured tables, add fields and records, and import/export CSV."><title>DataNest — MosSuite</title><style>

*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:#1e1e1e;color:var(--ink);font:13px/1.4 "Segoe UI",Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #0f6cbd;outline-offset:1px}
.topbar{min-height:48px;background:var(--excel-green);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;position:relative}.brand{display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none;font-weight:600;white-space:nowrap}.logo{width:28px;height:28px;object-fit:contain}.brand-text{display:flex;flex-direction:column;line-height:1.15}.brand-text small{font-size:10px;font-weight:400;opacity:.82;margin-top:3px}.topbar-links{display:flex;gap:16px;margin-left:auto;padding-right:62px}.topbar-links a{color:#fff;text-decoration:none;opacity:.94}.topbar-links a:hover{text-decoration:underline}
.filebar{min-height:48px;display:flex;align-items:center;gap:10px;padding:7px 18px;border-bottom:1px solid var(--line);background:var(--surface)}.excel-mark{width:25px;height:25px;background:#107c41;color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px;border-radius:2px;flex:none}.field{height:30px;min-width:0;border:1px solid #555;border-radius:2px;padding:4px 8px;background:#2b2b2b;color:#e6e6e6}.file-name-input{width:min(220px,35vw)}.saved{color:#aaa;font-size:12px}.file-spacer{flex:1}.file-actions{display:flex;gap:8px;align-items:center}
.tabs{display:flex;align-items:stretch;padding:0 18px;height:38px;border-bottom:1px solid var(--line);background:var(--surface);overflow-x:auto}.tab{border:0;background:transparent;padding:0 15px;color:#d6d6d6;white-space:nowrap;position:relative}.tab.active{color:var(--excel-green);font-weight:600}.tab.active:after{content:"";height:3px;position:absolute;left:10px;right:10px;bottom:0;background:var(--excel-green)}
.ribbon{min-height:84px;background:var(--ribbon);border-bottom:1px solid #c8c8c8;display:flex;align-items:stretch;padding:8px 16px;gap:0;overflow-x:auto}.rgroup{display:flex;align-items:center;gap:5px;padding:0 13px;border-right:1px solid #dedede;flex:none}.rgroup:first-child{padding-left:0}.rgroup:last-child{border-right:0}.rbutton,.btn{min-height:34px;display:flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:3px;background:transparent;padding:6px 9px;color:#242424;white-space:nowrap}.rbutton:hover,.btn:hover{background:#3a3a3a;border-color:#555}.rbutton.primary,.primary{background:var(--excel-green);color:#fff;border-color:var(--excel-green);font-weight:600}.rbutton.primary:hover,.primary:hover{background:var(--excel-green-dark)}.rbutton .ico{font-size:16px}.rgroup[hidden]{display:none!important}.rgroup-label{font-size:10px;color:#aaa;align-self:flex-end;text-align:center;margin:0 0 1px 8px;white-space:nowrap}.rgroup-main{display:flex;align-items:center;gap:5px}.status{margin:0;color:#aaa;font-size:12px}
.workspace{display:flex;flex-direction:column;min-height:calc(100vh - 218px)}.formula-bar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--surface)}.name-box{width:76px;text-align:center}.fx{font-size:16px;font-weight:600;color:#aaa;font-style:italic}.formula-input{flex:1;width:20px}.sheet-area{flex:1;overflow:auto;background:#1e1e1e;min-height:260px}.tablewrap{width:100%;height:100%;overflow:auto}table{border-collapse:separate;border-spacing:0;min-width:100%;width:max-content;color:#e6e6e6;font-size:13px}th,td{height:32px;min-width:150px;max-width:360px;border:0;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:0;background:var(--cell)}th{position:sticky;top:0;z-index:2;background:#2b2b2b;font-weight:600}th input{font-weight:600!important}th input,td input{width:100%;height:31px;min-width:100%;border:0;border-radius:0;padding:5px 8px;background:transparent;color:#e6e6e6}td:focus-within,th:focus-within{outline:2px solid #217346;outline-offset:-2px}td input:focus,th input:focus{outline:0}td .btn{margin:3px 6px;padding:3px 8px;border:1px solid #555;background:#2b2b2b;color:#e6e6e6;border-radius:2px}
.sheet-tabs{height:35px;border-top:1px solid #d0d0d0;background:#252525;display:flex;align-items:center;gap:0;padding:0 12px}.sheet-nav{color:#aaa;padding:0 8px}.sheet-tab{height:35px;padding:0 22px;border:0;border-bottom:3px solid var(--excel-green);background:#1e1e1e;color:#75c99a;font-weight:600}.sheet-add{border:0;background:transparent;font-size:19px;padding:0 12px;color:#ccc}.statusbar{height:26px;background:var(--excel-green);color:#fff;display:flex;align-items:center;padding:0 14px;font-size:11px;gap:18px}.statusbar .spacer{flex:1}.notice{padding:8px 14px;color:#666;background:#252525;border-top:1px solid #3b3b3b;font-size:11px}
@media(max-width:700px){.topbar{padding:8px 10px;gap:8px}.topbar-links{gap:10px;padding-right:48px}.brand-text small{display:none}.filebar{padding:7px 10px}.saved{display:none}.tabs{padding:0 6px}.ribbon{padding:7px 8px;min-height:74px}.rgroup{padding:0 7px}.rbutton{padding:6px 7px}.workspace{min-height:calc(100vh - 220px)}th,td{min-width:125px}.file-name-input{width:125px}}
@media(max-width:440px){.topbar-links a:nth-child(2){display:none}.filebar{gap:6px}.file-name-input{width:100px}.tabs .tab{padding:0 12px}.rbutton .label{display:none}.rbutton .ico{font-size:19px}.rgroup-label{font-size:9px}.formula-bar{padding:6px}.name-box{width:58px}}



/* The Import control is a label linked to a hidden file input; style it explicitly. */
body .filebar .file-actions > label[for="import"] {
  display: flex !important;
  align-items: center !important;
  gap: 7px !important;
  background-color: #252525 !important;
  background-image: none !important;
  border: 1px solid #4a4a4a !important;
  color: #fff !important;
  opacity: 1 !important;
  filter: none !important;
}
body .filebar .file-actions > label[for="import"] *,
body .filebar .file-actions > label[for="import"] .label,
body .filebar .file-actions > label[for="import"] .ico {
  color: #fff !important;
  opacity: 1 !important;
}
body .filebar .file-actions > label[for="import"]:hover {
  background-color: #383838 !important;
  border-color: #6a6a6a !important;
}
/* Give Import/Export controls a deliberate dark surface, not default grey styling. */
body .file-actions .rbutton,
body .ribbon .rbutton:not(.primary),
body .file-actions label.rbutton {
  background: #252525 !important;
  border: 1px solid #4a4a4a !important;
  color: #fff !important;
}
body .file-actions .rbutton:hover,
body .ribbon .rbutton:not(.primary):hover {
  background: #383838 !important;
  border-color: #6a6a6a !important;
  color: #fff !important;
}
body .file-actions .rbutton .label,
body .file-actions .rbutton .ico,
body .ribbon .rbutton .label,
body .ribbon .rbutton .ico {
  color: #fff !important;
}
/* DataNest dark mode: keep all button labels and interactive text white. */
body button,
body .btn,
body [role="button"],
body input[type="button"],
body input[type="submit"],
body select,
body .ribbon button,
body .filebar button,
body .tabs button,
body .sheet-tabs button,
body .toolbar button {
  color: #fff !important;
}
body button svg,
body .btn svg,
body [role="button"] svg { color: #fff !important; }
body button:disabled,
body input:disabled { color: #d0d0d0 !important; }

</head><body>
<header class="topbar"><a class="brand" href="../index.html"><img class="logo" src="../assets/mossuite-logo.svg" alt=""><span class="brand-text">MosSuite <small>DataNest · Spreadsheet</small></span></a><nav class="topbar-links"><a href="../index.html">Home</a><a href="https://github.com/moswebgr/Office">Source</a></nav></header>
<section class="filebar"><input class="field file-name-input" id="name" value="My dataset" aria-label="Workbook name"><span class="saved">Saved on this device</span><span class="file-spacer"></span><div class="file-actions"><button class="rbutton" id="export" title="Export CSV"><span class="ico">⇩</span><span class="label">Export</span></button><label class="rbutton" for="import" title="Import CSV"><span class="ico">⇧</span><span class="label">Import</span></label><input type="file" id="import" accept=".csv" hidden></div></section>
<nav class="tabs" aria-label="Spreadsheet tabs"><button class="tab active" type="button">Home</button><button class="tab" type="button">Insert</button><button class="tab" type="button">Data</button><button class="tab" type="button">View</button></nav>
<section class="ribbon"><div class="rgroup"><div class="rgroup-main"><button class="rbutton primary" id="row"><span class="ico">＋</span><span class="label">New record</span></button><button class="rbutton" id="field"><span class="ico">▤</span><span class="label">Add field</span></button></div><span class="rgroup-label">Table</span></div><div class="rgroup"><div class="rgroup-main"><button class="rbutton" id="export-copy" type="button"><span class="ico">⇩</span><span class="label">CSV export</span></button><button class="rbutton" id="import-copy" type="button"><span class="ico">⇧</span><span class="label">CSV import</span></button></div><span class="rgroup-label">Data</span></div><div class="rgroup"><div class="rgroup-main"><p id="status" class="status" role="status">Ready</p></div><span class="rgroup-label">Workbook status</span></div><div class="rgroup" id="view-tools" hidden><div class="rgroup-main"><button class="rbutton" id="toggle-formula" type="button"><span class="ico">ƒx</span><span class="label">Formula bar</span></button><button class="rbutton" id="toggle-grid" type="button"><span class="ico">▦</span><span class="label">Gridlines</span></button></div><span class="rgroup-label">View options</span></div></section>
<main class="workspace"><div class="formula-bar"><input class="field name-box" value="A1" aria-label="Cell reference" readonly><span class="fx">fx</span><input class="field formula-input" id="formula" placeholder="Select a cell to view its contents" aria-label="Cell contents" readonly></div><section class="sheet-area"><div class="tablewrap"><table id="table" aria-label="DataNest spreadsheet"></table></div></section><div class="sheet-tabs"><span class="sheet-nav">‹</span><span class="sheet-nav">›</span><button class="sheet-tab" type="button">Sheet1</button><button class="sheet-add" id="sheet-add" title="Add record">＋</button><span style="margin-left:auto;color:#666;font-size:11px">DataNest</span></div><div class="notice">Your workbook is stored in this browser. Use CSV import/export to move data between spreadsheets.</div></main><footer class="statusbar"><span id="footer-status">Ready</span><span>Accessibility: Good to go</span><span class="spacer"></span><span>100%</span></footer>
<script>(()=>{let $=s=>document.querySelector(s),fields=['Name','Category','Notes'],rows=[['Example','General','Edit this sample']];try{const d=JSON.parse(localStorage.getItem('mos.datanest.v2')||'null');if(Array.isArray(d?.fields)&&Array.isArray(d?.rows)){fields=d.fields;rows=d.rows}}catch{}function persist(){try{localStorage.setItem('mos.datanest.v2',JSON.stringify({fields,rows}))}catch{}}function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function draw(){let t=$('#table');t.innerHTML='<tr>'+fields.map((f,i)=>'<th><input data-f="'+i+'" value="'+esc(f)+'"></th>').join('')+'<th>Action</th></tr>'+rows.map((r,i)=>'<tr>'+fields.map((_,j)=>'<td><input data-c="'+i+','+j+'" value="'+esc(r[j]||'')+'"></td>').join('')+'<td><button class="btn" data-d="'+i+'">Delete</button></td></tr>').join('');t.querySelectorAll('[data-f]').forEach(x=>x.onchange=()=>{fields[+x.dataset.f]=x.value||'Field';persist();draw()});t.querySelectorAll('[data-c]').forEach(x=>x.onchange=()=>{let [i,j]=x.dataset.c.split(',').map(Number);rows[i][j]=x.value;persist()});t.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{rows.splice(+x.dataset.d,1);persist();draw()});$('#status').textContent=rows.length+' records · '+fields.length+' fields';$('#footer-status').textContent=rows.length+' records'}const tabs=[...document.querySelectorAll('.tabs .tab')];const groups=[...document.querySelectorAll('.ribbon .rgroup')];function activateTab(name){tabs.forEach(t=>{const active=t.textContent.trim()===name;t.classList.toggle('active',active);t.setAttribute('aria-selected',String(active))});groups.forEach((g,i)=>{g.hidden=name==='Insert'?i!==0:name==='Data'?i!==1:name==='View'?i!==3:false});$('#status').textContent=name==='Home'?'Ready':name==='Insert'?'Insert records or fields':name==='Data'?'Import or export CSV data':'View options';}tabs.forEach(t=>t.addEventListener('click',()=>activateTab(t.textContent.trim())));$('#toggle-formula').onclick=()=>{const bar=$('.formula-bar');bar.hidden=!bar.hidden;$('#toggle-formula').classList.toggle('primary',!bar.hidden)};$('#toggle-grid').onclick=()=>{document.querySelectorAll('#table th,#table td').forEach(el=>{el.style.borderRight=el.style.borderBottom=== 'none'?'':'none';el.style.borderBottom=el.style.borderBottom==='none'?'':'none'});$('#toggle-grid').classList.toggle('primary')};$('#export-copy').onclick=()=>$('#export').click();$('#import-copy').onclick=()=>$('#import').click();$('#sheet-add').onclick=()=>$('#row').click();$('#table').addEventListener('focusin',e=>{const c=e.target.closest('[data-c]');if(c){const parts=c.dataset.c.split(',').map(Number);$('.name-box').value=String.fromCharCode(65+parts[1])+(parts[0]+2);$('#formula').value=c.value}});$('#table').addEventListener('input',e=>{if(e.target.matches('[data-c]'))$('#formula').value=e.target.value});$('#field').onclick=()=>{let n=prompt('Field name','New field');if(n===null)return;fields.push(n||'Field');rows.forEach(r=>r.push(''));persist();draw()};$('#row').onclick=()=>{rows.push(Array(fields.length).fill(''));persist();draw()};$('#export').onclick=()=>{let d=[fields,...rows].map(r=>r.map(v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:'text/csv'}));a.download=($('#name').value||'datanest')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#import').onchange=async e=>{let f=e.target.files[0];if(!f)return;let d=(await f.text()).trim().split(/\r?\n/).map(l=>l.split(','));fields=d[0];rows=d.slice(1);persist();draw();e.target.value=''};draw()})();</script>
